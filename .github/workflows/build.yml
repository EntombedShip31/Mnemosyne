name: Build Mod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 首次构建要反编译 Minecraft + 拉取 Forge/ISS 依赖，20~40 分钟很正常；
    # 有 Gradle 缓存后通常在 5 分钟内完成。
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ⚠️ 必须是 17，不是 21。
      # build.gradle 里 java.toolchain.languageVersion = 17，
      # 且 MC 1.20.1 + ForgeGradle 6.0.x 官方只支持 17。
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 纯 stdlib、几秒跑完，放在构建**之前**：资源/数值/粒子预算漂移不用等 6 分钟才暴露。
      - name: Resource & number self-check
        run: |
          python3 tools/check_resources.py
          python3 tools/check_spell_numbers.py
          python3 tools/check_doc_numbers.py
          python3 tools/check_particle_budget.py

      - name: Build with Gradle
        # -Ppcl2_mods_dir：build.gradle 的 copyToMinecraftMods 默认把 jar 复制到
        # D:/PCL2/...（本地 PCL2 实例）。CI 上没有那个盘符，重定向到工作区内的
        # 临时目录，避免任务把文件复制到仓库根目录下莫名其妙的位置。
        run: ./gradlew build --no-daemon -Ppcl2_mods_dir="$GITHUB_WORKSPACE/build/ci-mods"

      - name: Locate mod jar
        id: jar
        run: |
          set -euo pipefail
          # reobfJar 是原地重命名，产物就在 build/libs；
          # 排除 sources/javadoc，只留真正能装进 mods 目录的那个。
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' \
                ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "::error::No mod jar found in build/libs"
            ls -R build/libs
            exit 1
          fi
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"
          echo "Found: $JAR"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mnemosyne-${{ github.ref_name }}-${{ github.sha }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
          retention-days: 30
