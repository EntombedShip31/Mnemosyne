# Gradle JVM memory
org.gradle.jvmargs=-Xmx3G
# ⭐ 2026-09-19：false → true。
#    false 会让每次 gradlew 都启动一个全新 JVM，把项目配置 + 依赖解析 + ForgeGradle
#    初始化整个重做一遍、跑完即销毁 —— 实测单次构建被拖到 10~20 分钟。
#    开着 daemon 后 JVM 复用，后续构建只需增量工作。
org.gradle.daemon=true

# Minecraft / Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.0
forge_version_range=[47.4.0,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# Mod info
mod_id=mnemosyne
# NOTE: Gradle reads gradle.properties as ISO-8859-1, so this file must stay pure ASCII.
# The Chinese display name / description live in src/main/resources/META-INF/mods.toml (UTF-8).
mod_name=Mnemosyne
mod_version=0.1.0
mod_group_id=com.etbs31.mnemosyne
mod_authors=EntombedShip31
mod_license=MIT
mod_issue_tracker=https://github.com/EntombedShip31/Mnemosyne/issues

# Core dependencies
# NOTE: the 1.20.1 branch of ISS is published on code.redspace.io maven starting at 3.15.0.
irons_spells_version=1.20.1-3.16.3
# ISS 1.20.1-3.16.3 declares curios versionRange="[5.14.1+1.20.1,)" in its own mods.toml.
# 5.4.7 is NOT enough: runClient fails with "Missing or unsupported mandatory dependencies".
curios_version=5.14.1+1.20.1
# ISS 1.20.1-3.16.3 also declares irons_lib versionRange="[1.20.1-2,1.20.1-3)".
# It is a runtime-only prerequisite (the ISS :api jar does not reference it at compile time).
irons_lib_version=1.20.1-2.1.0
geckolib_version=1.20.1:4.7.1.1
player_animator_version=1.0.2-rc1+1.20
caelus_version=3.1.0+1.20
